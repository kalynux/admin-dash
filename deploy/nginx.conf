# Serving a Vite single-page app. Three jobs: hand back index.html for routes
# that only exist in the browser, cache the hashed assets hard and index.html not
# at all, and refuse to pretend a missing file is a page.
#
# Copied into the image as /etc/nginx/conf.d/app.conf, replacing the stock
# default.conf (which has no SPA fallback and no cache policy).

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and talks to this container over plain HTTP on the
    # private dokploy-network. Logging the forwarded address rather than
    # Traefik's container IP is the difference between a useful access log and a
    # column of identical internal addresses.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Nothing here is a secret, but there is no reason to publish the version.
    server_tokens off;

    # ─── Compression ─────────────────────────────────────────────────────────
    # Text compresses by roughly 3-4x and this is the cheapest win available on a
    # 2 vCPU host. Images and fonts are already compressed — listing them would
    # spend CPU to make them very slightly larger.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ─── Baseline response headers ───────────────────────────────────────────
    # ⚠ NO Content-Security-Policy HERE, DELIBERATELY. A CSP that is wrong in
    #   production fails by making the app blank, and the correct policy for this
    #   bundle is not knowable from a config file — it depends on which inline
    #   styles the component library emits and which origins the app fetches.
    #   wi-admin sets its own CSP on its own responses, which is the half that
    #   protects the data. Adding one here is a deliberate piece of work with a
    #   staging pass, not a line to guess at during a first deploy.
    add_header X-Content-Type-Options "nosniff"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Nothing embeds the admin dashboard, and an administration console inside
    # somebody else's frame has no legitimate use.
    add_header X-Frame-Options        "DENY"                      always;

    # ─── API + health, reverse-proxied to wi-admin over the docker network ────
    # The browser talks only to this origin; nginx makes the hop to the wi-admin
    # backend at http://admin:8033 over the shared dokploy-network. That makes
    # every API call SAME-ORIGIN — no CORS, and no dependency on the browser
    # resolving a second (tailnet-only) hostname. wi-admin serves everything
    # under /api/v1 and mounts its health probes unversioned at /health, so both
    # prefixes are forwarded with the full original path preserved.
    #
    # ⚠ `admin` is the wi-admin service in the wi-mall stack; it shares
    #   dokploy-network with this container. It is resolved at RUNTIME via
    #   Docker's embedded DNS (127.0.0.11), not pinned at nginx start — so a
    #   backend redeploy that changes its container IP does not leave nginx
    #   proxying to a dead address until it is restarted. The variable in
    #   proxy_pass is what forces that per-request resolution.
    #
    # ⚠ X-Forwarded-Proto is hard-set to https, not $scheme: Traefik terminated
    #   TLS before this container and speaks plain HTTP to it, so $scheme here is
    #   `http`. wi-admin keys its Secure cookies and HTTPS assumptions off this
    #   header; sending `http` would make it drop the Secure flag or refuse.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $wi_admin_backend admin:8033;

    location ^~ /api/ {
        proxy_pass         http://$wi_admin_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location ^~ /health/ {
        proxy_pass         http://$wi_admin_backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        access_log off;
    }

    # ─── Hashed build output ─────────────────────────────────────────────────
    # Vite fingerprints every file in /assets, so the contents of a given name
    # can never change. Cache it for a year and never revalidate.
    #
    # ⚠ `try_files $uri =404` IS THE IMPORTANT LINE, NOT THE CACHING.
    #   Without it these requests fall through to the SPA fallback below and a
    #   MISSING script is answered with index.html — 200 OK, Content-Type
    #   text/html, which the browser refuses to execute as a module. The symptom
    #   is a blank page with a console error about MIME types and a perfectly
    #   clean server log. A 404 here says what actually happened.
    location /assets/ {
        try_files   $uri =404;
        expires     1y;
        add_header  Cache-Control "public, max-age=31536000, immutable" always;
        access_log  off;
    }

    # Same reasoning for the other fingerprint-free static files: a typo in an
    # icon path should 404, not silently return the whole application.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|map)$ {
        try_files   $uri =404;
        expires     30d;
        add_header  Cache-Control "public, max-age=2592000" always;
        access_log  off;
    }

    # ─── The document ────────────────────────────────────────────────────────
    # index.html names the current hashed bundle, so a cached copy is how a
    # browser keeps loading the PREVIOUS release after a deploy — and because the
    # old assets are gone, that is a blank page rather than a stale page. It must
    # never be cached anywhere: not the browser, not a proxy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        expires    -1;
    }

    # ─── Everything else is a client-side route ──────────────────────────────
    # React Router owns /dashboard/**, /login and the rest. The server has no
    # such files, so every unmatched path gets the document and the router
    # decides — including the 404 page, which is why this is a 200 and not an
    # error.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A container-local liveness probe. Kept out of the access log so the
    # healthcheck does not bury real traffic.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }
}
